version: '3.8'

services:
  weather-app:
    build: .
    container_name: weather-forecast
    ports:
      - "8080:8080"
    restart: unless-stopped
    volumes:
      # 数据持久化: 将宿主机文件映射到容器
      - ./weather_data.json:/app/weather_data.json
    environment:
      - TZ=Asia/Shanghai

networks:
  default:
    name: weather-network
