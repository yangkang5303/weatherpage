<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球天气预报</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #4a90d9;
            --secondary-color: #6c5ce7;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-primary: #2c3e50;
            --text-secondary: #7f8c8d;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            --forecast-bg: #f8f9fa;
            --modal-bg: white;
            --input-border: #e8e8e8;
            --city-item-bg: #f8f9fa;
            --city-item-hover: #e8f4fd;
            --grid-item-bg: #f8f9fa;
        }

        body.dark-mode {
            --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --card-bg: rgba(30, 30, 50, 0.97);
            --text-primary: #e0e0e0;
            --text-secondary: #9a9ab0;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            --forecast-bg: #252540;
            --modal-bg: #1e1e38;
            --input-border: #3a3a5a;
            --city-item-bg: #252540;
            --city-item-hover: #1a3a5a;
            --grid-item-bg: #252540;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s ease;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 500;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .map-container, .weather-card, .modal {
            background: var(--card-bg);
            color: var(--text-primary);
        }

        .map-container {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 15px;
            box-shadow: var(--shadow);
            transition: background 0.3s ease;
        }

        .map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .map-title {
            font-size: 1.1rem;
            color: var(--text-primary);
            font-weight: 500;
        }

        .map-toggle {
            display: flex;
            gap: 8px;
        }

        .map-toggle button {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            background: #e8e8e8;
            color: var(--text-secondary);
        }

        .map-toggle button.active {
            background: var(--primary-color);
            color: white;
        }

        .map-toggle button:hover:not(.active) {
            background: #d0d0d0;
        }

        #map {
            height: 500px;
            border-radius: 15px;
            z-index: 1;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .weather-card {
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
            transition: background 0.3s ease;
        }

        .search-box {
            position: relative;
            margin-bottom: 15px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: 2px solid var(--input-border);
            border-radius: 25px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
            background: var(--card-bg);
            color: var(--text-primary);
        }

        .search-box input:focus {
            border-color: var(--primary-color);
        }

        .search-box button {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-box button:hover {
            background: var(--secondary-color);
        }

        .section-title {
            font-size: 1rem;
            color: var(--text-primary);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .city-list {
            max-height: 350px;
            overflow-y: auto;
        }

        .city-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 8px;
            background: var(--city-item-bg);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .city-item:hover {
            background: var(--city-item-hover);
            transform: translateX(5px);
        }

        .city-item.favorite {
            border-left: 4px solid var(--secondary-color);
        }

        .city-info h4 {
            font-size: 0.95rem;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .city-info span {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .city-local-time {
            display: block;
            font-size: 0.75rem;
            color: var(--primary-color);
            font-variant-numeric: tabular-nums;
            margin-top: 2px;
        }

        .popup-time {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .city-temp {
            text-align: right;
        }

        .city-temp .temp {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--primary-color);
        }

        .city-temp .condition {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .city-actions {
            display: flex;
            gap: 5px;
            margin-top: 8px;
        }

        .city-actions button {
            padding: 4px 10px;
            font-size: 0.7rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-add {
            background: #27ae60;
            color: white;
        }

        .btn-add:hover {
            background: #219a52;
        }

        .btn-remove {
            background: #e74c3c;
            color: white;
        }

        .btn-remove:hover {
            background: #c0392b;
        }

        .btn-add-fav {
            background: none;
            border: none;
            color: #27ae60;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 50%;
            line-height: 1;
            transition: background 0.2s;
        }

        .btn-add-fav:hover {
            background: rgba(39, 174, 96, 0.15);
        }

        /* Weather Detail Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--modal-bg);
            border-radius: 20px;
            padding: 20px 24px;
            max-width: 720px;
            width: 95%;
            animation: slideUp 0.3s ease;
        }

        .modal-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            align-items: start;
        }

        @media (max-width: 600px) {
            .modal-body {
                grid-template-columns: 1fr;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: var(--text-primary);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .weather-detail {
            text-align: center;
        }

        .weather-detail .temp-large {
            font-size: 3rem;
            font-weight: 300;
            color: var(--primary-color);
            line-height: 1.1;
        }

        .weather-detail .condition-large {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .weather-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 0;
        }

        .weather-grid-item {
            background: var(--grid-item-bg);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            transition: background 0.3s ease;
        }

        .weather-grid-item .label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 3px;
        }

        .weather-grid-item .value {
            font-size: 0.95rem;
            color: var(--text-primary);
            font-weight: 500;
        }

        .forecast-list {
            margin-top: 0;
        }

        .forecast-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: var(--forecast-bg);
            border-radius: 8px;
            margin-bottom: 5px;
            transition: background 0.3s ease;
        }

        .forecast-precip {
            font-size: 0.75rem;
            color: #4a90d9;
            margin-top: 3px;
        }

        .precip-bar-wrap {
            width: 60px;
            height: 4px;
            background: #dde;
            border-radius: 2px;
            margin-top: 4px;
        }

        .precip-bar {
            height: 4px;
            background: #4a90d9;
            border-radius: 2px;
        }

        .forecast-date {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .forecast-temp {
            font-size: 0.95rem;
            color: var(--text-primary);
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 50px;
            height: 50px;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        /* Tab styling */
        .tabs {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            color: var(--text-secondary);
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.3s ease;
        }

        .tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Custom scrollbar */
        .city-list::-webkit-scrollbar {
            width: 6px;
        }

        .city-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }

        .city-list::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }

        .city-list::-webkit-scrollbar-thumb:hover {
            background: #a1a1a1;
        }

        /* Header controls */
        .header-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .header-btn {
            padding: 7px 18px;
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 20px;
            background: rgba(255,255,255,0.15);
            color: white;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .header-btn:hover, .header-btn.active {
            background: rgba(255,255,255,0.35);
            border-color: white;
        }

        .uv-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            color: white;
        }
        .uv-low    { background: #4caf50; }
        .uv-mod    { background: #ffc107; color: #333; }
        .uv-high   { background: #ff9800; }
        .uv-vhigh  { background: #f44336; }
        .uv-ext    { background: #9c27b0; }

        /* Marker popup styling */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
        }

        .marker-popup {
            text-align: center;
            min-width: 150px;
        }

        .marker-popup h4 {
            margin-bottom: 5px;
            color: var(--text-primary);
        }

        .marker-popup .temp {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary-color);
        }

        .marker-popup .condition {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 0.9rem;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .toast.show {
            opacity: 1;
        }

        /* ── Accessibility ─────────────────────────────────────────────── */

        /* Skip-to-content link for keyboard users */
        .skip-link {
            position: absolute;
            top: -100%;
            left: 12px;
            background: #000;
            color: #fff;
            padding: 10px 18px;
            border-radius: 0 0 8px 8px;
            font-size: 0.95rem;
            z-index: 9999;
            text-decoration: none;
            font-weight: 600;
        }
        .skip-link:focus { top: 0; }

        /* Global focus ring — never invisible */
        *:focus-visible {
            outline: 3px solid #005fcc;
            outline-offset: 3px;
            border-radius: 4px;
        }

        /* Stronger secondary text contrast — #6b7280 is ≥4.6:1 on white */
        :root { --text-secondary: #6b7280; }
        body.dark-mode { --text-secondary: #a0a8b8; }

        /* Minimum readable font sizes */
        .city-info span,
        .city-local-time,
        .forecast-date,
        .forecast-precip,
        .weather-grid-item .label,
        .city-temp .condition,
        .marker-popup .condition,
        .popup-time { font-size: 0.825rem; }  /* floor at ~13px */

        /* Minimum 44×44 px tap targets (WCAG 2.5.5) */
        .btn-add-fav {
            min-width: 44px;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .map-toggle button,
        .header-btn,
        .modal-close,
        .city-actions button,
        .search-box button {
            min-height: 44px;
        }

        /* UV badge: add a shape indicator, not color alone */
        .uv-badge::before {
            margin-right: 4px;
        }
        .uv-low::before    { content: '▲'; }   /* low risk    */
        .uv-mod::before    { content: '▲▲'; }
        .uv-high::before   { content: '▲▲▲'; }
        .uv-vhigh::before  { content: '▲▲▲▲'; }
        .uv-ext::before    { content: '▲▲▲▲▲'; }

        /* Precipitation bar: add a text pattern so colorblind users get it */
        .precip-bar-wrap { position: relative; }

        /* Respect reduced-motion preference */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* High-contrast mode support */
        @media (forced-colors: active) {
            .uv-badge, .btn-add, .btn-remove, .btn-add-fav {
                border: 2px solid ButtonText;
            }
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#cityInput">Skip to search</a>
    <div class="container">
        <header>
            <h1 id="pageTitle">🌍 全球天气预报</h1>
            <div class="header-controls">
                <button class="header-btn active" id="unitToggleBtn" onclick="toggleTempUnit()">🌡️ °C</button>
                <button class="header-btn" id="darkModeBtn" onclick="toggleDarkMode()">🌙 深色模式</button>
                <button class="header-btn" id="langBtn" onclick="toggleLang()">🌐 English</button>
            </div>
        </header>

        <div class="main-content">
            <div class="map-container">
                <div class="map-header">
                    <span class="map-title" id="mapTitle">🗺️ 地图视图</span>
                    <div class="map-toggle">
                        <button id="worldMapBtn" class="active" onclick="switchMap('world')">世界</button>
                        <button id="chinaMapBtn" onclick="switchMap('china')">中国</button>
                        <button id="usaMapBtn" onclick="switchMap('usa')">美国</button>
                        <button id="ukMapBtn" onclick="switchMap('uk')">英国</button>
                        <button id="franceMapBtn" onclick="switchMap('france')">法国</button>
                        <button id="germanyMapBtn" onclick="switchMap('germany')">德国</button>
                        <button id="thailandMapBtn" onclick="switchMap('thailand')">泰国</button>
                    </div>
                </div>
                <div id="map"></div>
            </div>

            <div class="sidebar">
                <div class="weather-card">
                    <div class="search-box">
                        <input type="text" id="cityInput" placeholder="搜索城市..." onkeypress="handleSearch(event)">
                        <button id="searchBtn" onclick="searchCity()">搜索</button>
                    </div>

                    <div class="tabs">
                        <div class="tab active" id="tabPopular" onclick="switchTab('popular')">热门城市</div>
                        <div class="tab" id="tabFavorites" onclick="switchTab('favorites')">我的关注</div>
                    </div>

                    <div id="popularTab" class="tab-content active">
                        <div class="city-list" id="popularCityList"></div>
                    </div>

                    <div id="favoritesTab" class="tab-content">
                        <div class="city-list" id="favoritesCityList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Weather Detail Modal -->
    <div class="modal-overlay" id="weatherModal" role="dialog" aria-modal="true" aria-labelledby="modalCityName">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalCityName">城市天气</h3>
                <button class="modal-close" onclick="closeModal()" aria-label="Close">&times;</button>
            </div>
            <div class="weather-detail" id="weatherDetail">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Global variables
        let map;

        let currentMapType = 'world';

                mapView: '🗺️ 地图视图',
                world: '世界', china: '中国', usa: '美国',
                uk: '英国', france: '法国', germany: '德国', thailand: '泰国',

                cityNotFound: '未找到该城市', searchFail: '搜索失败，请重试',
                noWeatherData: '无法获取天气数据',
                wClear: '晴朗', wPartly: '晴间多云', wCloudy: '多云', wOvercast: '阴天',

            en: {

                darkMode: '🌙 Dark Mode', lightMode: '☀️ Light Mode',
                mapView: '🗺️ Map View',
                world: 'World', china: 'China', usa: 'USA',
                uk: 'UK', france: 'France', germany: 'Germany', thailand: 'Thailand',
                popular: 'Popular', favorites: 'My Favorites',

                loading: 'Loading weather data...', loadingShort: 'Loading...',
                noData: 'No data',

        // XSS-safe HTML escaping for all user/API-derived strings
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

            const dirs = lang === 'zh' ? zh : en;
            return dirs[Math.round(deg / 45) % 8];
        }

        // Weather code to description
        function weatherCodeToDesc(code) {
            const codes = {
                0: t('wClear'), 1: t('wPartly'), 2: t('wCloudy'), 3: t('wOvercast'),
                45: t('wFog'), 48: t('wRimeFog'),
                51: t('wLDrizzle'), 53: t('wMDrizzle'), 55: t('wHDrizzle'),
                61: t('wLRain'), 63: t('wMRain'), 65: t('wHRain'),
                71: t('wLSnow'), 73: t('wMSnow'), 75: t('wHSnow'),
                80: t('wLShower'), 81: t('wMShower'), 82: t('wHShower'),
                95: t('wThunder'), 96: t('wThunderHail'), 99: t('wThunderHHail')
            };
            return codes[code] || t('wUnknown');
        }

        // Get weather icon
        function getWeatherIcon(code) {
            if (code === 0) return '☀️';
            if (code >= 1 && code <= 3) return '⛅';
            if (code >= 45 && code <= 48) return '🌫️';
            if (code >= 51 && code <= 55) return '🌧️';
            if (code >= 61 && code <= 65) return '🌧️';
            if (code >= 71 && code <= 75) return '❄️';
            if (code >= 80 && code <= 82) return '🌦️';
            if (code >= 95) return '⛈️';
            return '🌤️';
        }

        // Fetch weather data with 1-hour localStorage cache
        const CACHE_TTL = 60 * 60 * 1000; // 1 hour in ms

        async function fetchWeather(lat, lon, cityName, country) {
            const cacheKey = `weather_v2_${cityName}`;
            const cached = localStorage.getItem(cacheKey);
            if (cached) {
                try {
                    const { timestamp, data } = JSON.parse(cached);
                    if (Date.now() - timestamp < CACHE_TTL) {
                        return data;
                    }
                } catch (e) {
                    // ignore corrupted cache entry
                }
            }

            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,uv_index&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max&timezone=auto`;

            try {
                const response = await fetch(url);
                const raw = await response.json();

                const data = {
                    location: { name: cityName, country: country, lat, lon },
                    current: raw.current,
                    daily: raw.daily,
                    timezone: raw.timezone
                };
                localStorage.setItem(cacheKey, JSON.stringify({ timestamp: Date.now(), data }));
                return data;
            } catch (error) {
                console.error('Weather fetch error:', error);
                return null;
            }
        }

            // Clear existing markers
            Object.values(markers).forEach(marker => map.removeLayer(marker));
            markers = {};
            
            // Get cities for the selected country
            const cities = countryCities[type] || countryCities.world;
            const center = mapCenters[type] || mapCenters.world;
            
            map.setView([center.lat, center.lon], center.zoom);

        // Load weather for cities
        async function loadWeatherForCities(cities) {
            const container = document.getElementById('popularCityList');
            container.innerHTML = `<div class="loading">${t('loading')}</div>`;
            
            // Fetch weather for all cities
            for (const city of cities) {
                const weather = await fetchWeather(city.lat, city.lon, city.name, city.country);
                if (weather) {
                    weatherData[city.name] = weather;
                    addMarker(city, weather);
                }
            }
            
            renderCityList(cities);
        }

        // Add marker to map
        function addMarker(city, weather) {
            const rawTemp = weather.current?.temperature_2m;
            const temp = toDisplayTemp(rawTemp);
            const code = weather.current?.weather_code || 0;

            const marker = L.marker([city.lat, city.lon]).addTo(map);

            const tz = weather.timezone || '';
            const localTime = tz ? getLocalTime(tz) : '';
            const timeStr = localTime ? `<div class="popup-time">🕐 ${localTime}</div>` : '';

            const popupContent = `
                <div class="marker-popup">
                    <h4>${escapeHtml(city.name)}, ${escapeHtml(city.country)}</h4>
                    <div class="temp">${escapeHtml(temp)}${tempLabel()}</div>
                    <div class="condition">${getWeatherIcon(code)} ${weatherCodeToDesc(code)}</div>
                    ${timeStr}
                </div>
            `;

            marker.bindPopup(popupContent);
            marker.on('click', () => showWeatherDetail(city.name));

            markers[city.name] = marker;
        }

        // Render city list
        async function renderCityList(cities) {
            const container = document.getElementById('popularCityList');
            const data = await loadData();
            const favorites = data.favoriteCities || [];
            
            let html = '';
            cities.forEach(city => {
                const weather = weatherData[city.name];
                if (!weather) return;
                
                const temp = toDisplayTemp(weather.current?.temperature_2m);
                const code = weather.current?.weather_code || 0;
                const isFavorite = favorites.some(f => f.name === city.name);
                const tz = weather.timezone || '';
                const localTime = currentMapType === 'world' && tz ? getLocalTime(tz) : '';
                const timeHTML = localTime
                    ? `<span class="city-local-time" data-timezone="${tz}">${localTime}</span>`
                    : '';

                const eName = escapeHtml(city.name);
                const eCountry = escapeHtml(city.country);
                html += `
                    <div class="city-item ${isFavorite ? 'favorite' : ''}" onclick="showWeatherDetail('${eName}')">
                        <div class="city-info">
                            <h4>${eName}</h4>
                            <span>${eCountry}</span>
                            ${timeHTML}
                        </div>
                        <div class="city-temp">
                            <div class="temp">${escapeHtml(temp)}${tempLabel()}</div>
                            <div class="condition">${getWeatherIcon(code)} ${weatherCodeToDesc(code)}</div>
                        </div>
                        ${!isFavorite ? `<button class="btn-add-fav" onclick="event.stopPropagation(); addToFavorites('${eName}')" title="${t('addFav')}" aria-label="${t('addFav')}: ${eName}">+</button>` : ''}
                    </div>
                `;
            });
            
            container.innerHTML = html || `<div class="empty-state">${t('noData')}</div>`;

            renderFavorites();
        }

        // Render favorites
        async function renderFavorites() {
            const container = document.getElementById('favoritesCityList');
            const data = await loadData();
            const favorites = data.favoriteCities || [];
            
            if (favorites.length === 0) {
                container.innerHTML = `<div class="empty-state"><p>${t('noFavorites')}</p><p style="font-size: 0.8rem; margin-top: 10px;">${t('noFavoritesHint')}</p></div>`;
                return;
            }
            
            let html = '';
            for (const city of favorites) {
                let weather = weatherData[city.name];
                
                if (!weather) {
                    weather = await fetchWeather(city.lat, city.lon, city.name, city.country);
                    if (weather) {
                        weatherData[city.name] = weather;
                    }
                }
                
                if (weather) {
                    const temp = toDisplayTemp(weather.current?.temperature_2m);
                    const code = weather.current?.weather_code || 0;

                    const eName = escapeHtml(city.name);
                    const eCountry = escapeHtml(city.country);
                    html += `
                        <div class="city-item favorite" onclick="showWeatherDetail('${eName}')">
                            <div class="city-info">
                                <h4>${eName}</h4>
                                <span>${eCountry}</span>
                            </div>
                            <div class="city-temp">
                                <div class="temp">${escapeHtml(temp)}${tempLabel()}</div>
                                <div class="condition">${getWeatherIcon(code)} ${weatherCodeToDesc(code)}</div>
                            </div>
                        </div>
                        <div class="city-actions">
                            <button class="btn-remove" onclick="removeFavorite('${eName}', event)" aria-label="${t('remove')}: ${eName}">${t('remove')}</button>
                        </div>
                    `;
                }
            }
            
            container.innerHTML = html || `<div class="empty-state">${t('loadingShort')}</div>`;
        }

        // Show weather detail modal
        async function showWeatherDetail(cityName) {
            const modal = document.getElementById('weatherModal');
            const detailContainer = document.getElementById('weatherDetail');
            const titleEl = document.getElementById('modalCityName');
            
            closeModal._opener = document.activeElement;
            modal.classList.add('active');
            setTimeout(() => modal.querySelector('.modal-close')?.focus(), 50);
            detailContainer.innerHTML = `<div class="loading">${t('loadingShort')}</div>`;
            
            let weather = weatherData[cityName];
            
            if (!weather) {
                // Try to find city in all city arrays
                const city = findCity(cityName);
                
                if (city) {
                    weather = await fetchWeather(city.lat, city.lon, city.name, city.country);
                    if (weather) weatherData[cityName] = weather;
                }
            }
            
            if (!weather) {
                detailContainer.innerHTML = `<div class="empty-state">${t('noWeatherData')}</div>`;
                return;
            }
            
            titleEl.textContent = `${weather.location.name}, ${weather.location.country}`; // textContent is safe
            
            const temp = toDisplayTemp(weather.current?.temperature_2m);
            const feelsLike = toDisplayTemp(weather.current?.apparent_temperature);
            const humidity = weather.current?.relative_humidity_2m ?? 'N/A';
            const wind = weather.current?.wind_speed_10m ?? 'N/A';
            const windDir = weather.current?.wind_direction_10m;
            const windDirStr = windDir != null ? `${degToCompass(windDir)} (${windDir}°)` : 'N/A';
            const uvIndex = weather.current?.uv_index ?? 'N/A';
            const code = weather.current?.weather_code || 0;

            // Build 7-day forecast HTML
            let forecastHTML = `<div class="forecast-list"><h4 style="margin-bottom: 10px; color: var(--text-primary);">${t('forecast7')}</h4>`;
            const times = weather.daily?.time || [];
            const maxTemps = weather.daily?.temperature_2m_max || [];
            const minTemps = weather.daily?.temperature_2m_min || [];
            const codes = weather.daily?.weather_code || [];
            const precipProbs = weather.daily?.precipitation_probability_max || [];

            for (let i = 0; i < Math.min(7, times.length); i++) {
                const precip = precipProbs[i] ?? 0;
                const maxT = toDisplayTemp(maxTemps[i]);
                const minT = toDisplayTemp(minTemps[i]);
                forecastHTML += `
                    <div class="forecast-item">
                        <span class="forecast-date">${times[i]}</span>
                        <span class="forecast-temp">${getWeatherIcon(codes[i])} ${minT}° ~ ${maxT}${tempLabel()}</span>
                        <div style="text-align:right">
                            <div class="forecast-precip">💧 ${precip}%</div>
                            <div class="precip-bar-wrap"><div class="precip-bar" style="width:${precip}%"></div></div>
                        </div>
                    </div>
                `;
            }
            forecastHTML += '</div>';

            const uvClass = uvIndex !== 'N/A' ? getUVClass(uvIndex) : '';
            const uvDisplay = uvIndex !== 'N/A'
                ? `<span class="uv-badge ${uvClass}">${uvIndex} ${getUVLabel(uvIndex)}</span>`
                : 'N/A';

            detailContainer.innerHTML = `
                <div class="modal-body">
                    <div class="modal-left">
                        <div class="weather-detail" style="text-align:center; margin-bottom:12px;">
                            <div class="temp-large">${temp}${tempLabel()}</div>
                            <div class="condition-large">${getWeatherIcon(code)} ${weatherCodeToDesc(code)}</div>
                        </div>
                        <div class="weather-grid">
                            <div class="weather-grid-item">
                                <div class="label">${t('feelsLike')}</div>
                                <div class="value">${feelsLike}${tempLabel()}</div>
                            </div>
                            <div class="weather-grid-item">
                                <div class="label">${t('humidity')}</div>
                                <div class="value">${humidity}%</div>
                            </div>
                            <div class="weather-grid-item">
                                <div class="label">${t('windDir')}</div>
                                <div class="value">${wind} km/h ${windDirStr}</div>
                            </div>
                            <div class="weather-grid-item">
                                <div class="label">${t('uvIndex')}</div>
                                <div class="value">${uvDisplay}</div>
                            </div>
                        </div>
                        <div style="text-align:center; margin-top:12px;">
                            <button class="btn-add" onclick="addToFavorites('${escapeHtml(cityName)}')">${t('addFav')}</button>
                        </div>
                    </div>
                    <div class="modal-right">
                        ${forecastHTML}
                    </div>
                </div>
            `;
        }

        // Close modal
        function closeModal() {
            document.getElementById('weatherModal').classList.remove('active');
            // Return focus to the element that opened the modal
            if (closeModal._opener) { closeModal._opener.focus(); closeModal._opener = null; }
        }

        // Trap focus inside modal while open
        document.getElementById('weatherModal').addEventListener('keydown', function(e) {
            if (e.key === 'Escape') { closeModal(); return; }
            if (e.key !== 'Tab') return;
            const focusable = this.querySelectorAll('button, [href], input, [tabindex]:not([tabindex="-1"])');
            const first = focusable[0], last = focusable[focusable.length - 1];
            if (e.shiftKey) { if (document.activeElement === first) { e.preventDefault(); last.focus(); } }
            else            { if (document.activeElement === last)  { e.preventDefault(); first.focus(); } }
        });

        // Search city
        async function searchCity() {
            const input = document.getElementById('cityInput');
            const cityName = input.value.trim();
            
            if (!cityName) return;
            
            // Geocoding
            const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=zh&format=json`;
            
            try {
                const response = await fetch(geoUrl);
                const data = await response.json();
                
                if (!data.results || data.results.length === 0) {
                    showToast(t('cityNotFound'));
                    return;
                }
                
                const result = data.results[0];
                const city = {
                    name: result.name,
                    country: result.country || '',
                    lat: result.latitude,
                    lon: result.longitude
                };
                
                // Fetch weather
                const weather = await fetchWeather(city.lat, city.lon, city.name, city.country);
                if (weather) {
                    weatherData[city.name] = weather;
                    addMarker(city, weather);
                    map.setView([city.lat, city.lon], 10);
                    showWeatherDetail(city.name);
                }
                
                input.value = '';
            } catch (error) {
                showToast(t('searchFail'));
            }
        }

        // Handle search keypress
        function handleSearch(event) {
            if (event.key === 'Enter') {
                searchCity();
            }
        }

        // Find city in all city arrays
        function findCity(cityName) {
            for (const key in countryCities) {
                const city = countryCities[key].find(c => c.name === cityName);
                if (city) return city;
            }
            // Try to get from weatherData
            if (weatherData[cityName]) {
                return {
                    name: weatherData[cityName].location.name,
                    country: weatherData[cityName].location.country,
                    lat: weatherData[cityName].location.lat,
                    lon: weatherData[cityName].location.lon
                };
            }
            return null;
        }

        // Add to favorites
        async function addToFavorites(cityName) {
            const data = await loadData();
            
            // Check if already exists
            if (data.favoriteCities && data.favoriteCities.some(f => f.name === cityName)) {
                showToast(t('alreadyFav'));
                return;
            }
            
            // Find city data
            const city = findCity(cityName);
            
            if (city) {
                const favorites = await saveFavorite(city);
                if (favorites) {
                    renderFavorites();
                    showToast(t('addedFav'));
                    
                    // Update popular list to show favorite indicator
                    const cities = countryCities[currentMapType] || countryCities.world;
                    renderCityList(cities);
                }
            }
        }

        // Remove from favorites
        async function removeFavorite(cityName, event) {
            event.stopPropagation();
            
            const favorites = await removeFavoriteAPI(cityName);
            if (favorites !== null) {
                renderFavorites();
                const cities = countryCities[currentMapType] || countryCities.world;
                renderCityList(cities);
                showToast(t('removedFav'));
            }
        }

        // Switch tabs
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            if (tab === 'popular') {
                document.querySelector('.tab:first-child').classList.add('active');
                document.getElementById('popularTab').classList.add('active');
            } else {
                document.querySelector('.tab:last-child').classList.add('active');
                document.getElementById('favoritesTab').classList.add('active');
            }
        }

        // Show toast notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', initMap);

        // Close modal when clicking outside
        document.getElementById('weatherModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
